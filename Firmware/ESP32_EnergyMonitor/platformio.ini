; ============================================================
;  PlatformIO Configuration — ESP32 Energy Monitor Firmware
;  รองรับทั้ง Arduino IDE และ PlatformIO (VSCode Extension)
; ============================================================

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino

; ── Serial Monitor ──────────────────────────────────────────
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; ── Library Dependencies ────────────────────────────────────
lib_deps =
  ; PZEM-004T v3.0 Library
  olehs/PZEM004Tv30 @ ^1.1.2
  ; ArduinoJson (ใช้ v7 ที่รองรับ JsonDocument ใหม่)
  bblanchon/ArduinoJson @ ^7.0.0

; ── Build Flags ─────────────────────────────────────────────
build_flags =
  -DARDUINO_ESP32_DEV
  -DCORE_DEBUG_LEVEL=3

; ── Upload Settings ─────────────────────────────────────────
; เปลี่ยน upload_port ให้ตรงกับ COM Port ของคุณ
; upload_port = COM3       ; Windows
; upload_port = /dev/ttyUSB0  ; Linux/Mac
upload_speed = 921600
